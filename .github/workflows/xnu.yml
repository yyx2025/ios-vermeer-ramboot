name: K70 v11 GPU display and Wi-Fi integration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xnu-buildtree
          path: prior-buildtree
          run-id: 42750699047
          github-token: ${{ github.token }}
      - name: Extract retained XNU8796 build tree
        run: |
          mkdir prior-tree
          tar xzf prior-buildtree/buildtree.tgz -C prior-tree
      - name: Compile GPU startup, display delivery and network interface
        run: |
          brew install llvm
          python3 gpu-full/compile_full.py --xnu-root "$PWD/prior-tree"
      - name: Check MHI DMA alignment and retained ownership
        if: always()
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -Igpu-full/K70 gpu-full/tests/wifi_dma_host.c gpu-full/K70/K70WifiDma.c -o wifi-dma
          ./wifi-dma 4096
          ./wifi-dma 16384
      - name: Check display ownership with sanitizers
        if: always()
        run: |
          for page in 4096 16384; do
            clang++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined -g -DTEST_PAGE_BYTES=$page -DSWEET -Igpu-full/tests/display_mock -Igpu-full/K70Display gpu-full/tests/k70_display_test.cpp -o display-$page
            for scenario in snapshot timeout unconfirmed_success completion precommit map_failure bad_map allocation_failure replace cpu_arm_race swap_end sequence_exhaustion; do
              ASAN_OPTIONS=detect_leaks=0 ./display-$page "$scenario"
            done
          done
      - name: Compile the frontend using the iOS SDK
        if: always()
        run: python3 gpu-full/compile_metal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k70-v11-integration
          path: |
            gpu-full/full-compile.json
            gpu-full/full-objects
            gpu-full/metal-compile.json
            gpu-full/metal-objects
          retention-days: 7
