name: K70 v11.37 iOS16 Metal runtime
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check plugin with the actual iOS SDK
        run: xcrun --sdk iphoneos clang++ -target arm64-apple-ios16.0 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -std=c++17 -fobjc-arc -fblocks -fsyntax-only -I gpu-runtime/drivers/NativeAdreno gpu-runtime/drivers/NativeMetal/NativeAdrenoMetalPlugin.mm
      - name: Install build dependencies
        run: brew install llvm bison glslang ninja
      - name: Build iOS16 Metal bridge and cache-enabled Turnip
        run: python3 gpu-runtime/build_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k70-v11-37-runtime
          include-hidden-files: true
          path: |
            gpu-runtime/build/NativeAdrenoMetal.bundle
            gpu-runtime/build/runtime-report.json
            gpu-runtime/build/native-metal-bridge/*.log
            gpu-runtime/.cache/*-ios-*.log
            gpu-runtime/build/mesa-tu-ios/builtin-build-profile.json
            gpu-runtime/build/mesa-tu-ios/meson-info/intro-buildoptions.json
          retention-days: 7
