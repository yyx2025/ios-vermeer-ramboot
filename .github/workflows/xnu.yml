name: Full K70 iOS16 GPU and Wi-Fi ABI build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xnu-buildtree
          path: prior-buildtree
          run-id: 42750699047
          github-token: ${{ github.token }}
      - name: Extract actual XNU8796 16K build headers
        run: |
          mkdir prior-tree
          tar xzf prior-buildtree/buildtree.tgz -C prior-tree
      - name: Verify actual GPU allocation and ownership functions
        run: |
          for page in 4096 16384; do
            clang++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined -g -DTEST_PAGE_BYTES=$page -Igpu-full/tests/mock -Igpu-full/Adreno740 gpu-full/tests/gpu_memory_host.cpp -o memory-$page
            ASAN_OPTIONS=detect_leaks=0 ./memory-$page
          done
      - name: Compile all GPU units, dependencies and Wi-Fi network interface
        run: python3 gpu-full/compile_full.py --xnu-root "$PWD/prior-tree"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k70-ios16-full-gpu-wifi
          path: |
            gpu-full/full-compile.json
            gpu-full/full-objects
          retention-days: 7
