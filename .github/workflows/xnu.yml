name: K70 v11 GPU kernel relink
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  link:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: xnu-link-inputs
          path: retained-link-inputs
          run-id: 43076755379
          github-token: ${{ github.token }}
      - name: Extract actual kernel objects and support libraries
        run: |
          mkdir dxb
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          root=Path('dxb').resolve()
          with tarfile.open('retained-link-inputs/link-inputs.tgz') as archive:
              members=[m for m in archive.getmembers() if m.isfile() or m.isdir()]
              assert all((root/m.name).resolve().is_relative_to(root) for m in members)
              archive.extractall(root,members=members,filter='data')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: k70-v11-integration
          path: gpu-driver-build
          run-id: 43078270426
          github-token: ${{ github.token }}
      - name: Link actual GPU worker and replacement framebuffer
        run: python3 v11-gpu-link/link_gpu_kernel.py --xnu-build dxb --drivers gpu-driver-build --output gpu-linked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k70-v11-gpu-linked
          path: gpu-linked/
          retention-days: 7
